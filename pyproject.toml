[project]
name = "cafe-research-crew"
version = "0.1.0"
description = "A concise, mobile-friendly cafe and restaurant research crew."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "crewai==1.15.17",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "python-dotenv==1.2.2",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
]

[project.scripts]
cafe-crew = "cafe_crew.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cafe_crew"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
