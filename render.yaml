services:
  - type: web
    name: cafe-research-crew
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: APP_ACCESS_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-4.1-mini
      - key: CREWAI_TRACING_ENABLED
        value: "true"
